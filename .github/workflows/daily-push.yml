name: Daglig träningspush

on:
  schedule:
    - cron: '0 17 * * *'   # 19:00 svensk sommartid
    - cron: '0 18 * * *'   # 19:00 svensk vintertid (skriptet kollar Stockholm-tid)
  workflow_dispatch:
    inputs:
      force:
        description: 'Skicka direkt oavsett klockslag (test)'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - run: node push/send.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          FORCE: ${{ inputs.force && '1' || '0' }}
